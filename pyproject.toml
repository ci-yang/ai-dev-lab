[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dev-lab-task-board"
version = "1.0.0"
description = "A local-only teaching CLI for verifiable AI-driven development."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Ci"}]
dependencies = []

[project.optional-dependencies]
# These are compatibility floors for package metadata. The exact teaching
# profile is constraints/runtime-profile.txt.
dev = [
  "black>=24.0",
  "isort>=5.13",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
task-board = "task_board.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
py_version = 312

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I"]

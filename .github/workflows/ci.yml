name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  full-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bootstrap
        run: scripts/bootstrap.sh
      - name: Verify
        run: scripts/verify.sh full
